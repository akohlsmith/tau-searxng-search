# Example configuration for tau-ext-searxng-search
extensions:
  std-searxng-search:
    enable: true
    config:
      base_url: "http://localhost:8080"
      timeout_seconds: 15
      default_categories:
        - general
        - local
      local_category_prefixes:
        - local-
        - hamsterbase
      fallback_urls:
        - "http://backup-searxng:8080"
