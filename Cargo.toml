[package]
name = "tau-ext-searxng-search"
version = "0.1.0"
edition = "2021"
description = "SearXNG search tool for Tau"
repository = "https://github.com/AndrewRider/searxng-search-tau"
homepage = "https://github.com/AndrewRider/searxng-search-tau"
readme = "README.md"
keywords = ["search", "searxng", "tau"]
categories = ["web-programming"]
rust-version = "1.75"
license = "GPL-3.0-or-later"

[lints]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tau-client = { path = "../tau/crates/tau-client" }
tau-proto = { path = "../tau/crates/tau-proto" }
tracing = "0.1"
ureq = { version = "2.8", features = ["tls"] }
url = "2.5"

[[bin]]
name = "tau-ext-searxng-search"
path = "src/main.rs"
